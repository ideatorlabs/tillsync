site_name: TillSync
site_description: "Every POS, API and spreadsheet, one clean shape. An open-source package by Ideator Labs."
site_url: https://ideatorlabs.github.io/tillsync/
repo_url: https://github.com/ideatorlabs/tillsync
repo_name: ideatorlabs/tillsync
edit_uri: edit/main/
copyright: Copyright &copy; 2026 Ideator Labs &middot; Apache-2.0

theme:
  name: material
  logo: assets/brand/mark.svg
  favicon: assets/brand/favicon.png
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/brand.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ideatorlabs/tillsync
      name: TillSync on GitHub
    - icon: material/hexagon-outline
      link: https://ideatorlabs.github.io/
      name: Ideator Labs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            heading_level: 2

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Configuration: configuration.md
  - Extending: extending.md
  - Development: development.md
  - Limits & roadmap: roadmap.md
  - API reference: reference.md
  - Changelog: changelog.md
  - Contributing: contributing.md
